[package]
name = "pumpkin-essentials"
version = "0.1.0"
edition = "2024"
description = "Essentials suite, permissions and chat formatting for Pumpkin"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "4426d111" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
